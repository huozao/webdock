name: release

# Build the webdock image in CI (not on the 旧电脑) and push it to GHCR, so the
# laptop only pulls. The Dockerfile bakes in Chrome + Playwright/Patchright, so
# the heavy build happens once on a GitHub runner and is layer-cached after that.
on:
  push:
    branches: [main]
    tags: ["V*", "v*"]

concurrency:
  group: webdock-release
  cancel-in-progress: false

jobs:
  # Gate the image build on the unit tests. A direct push to main does NOT run
  # ci.yml (that only fires on pull_request), so without this gate a broken commit
  # pushed straight to main would still ship an image. Tests patch the browser
  # layer, so no Chrome/Playwright download is needed here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/webdock
          # Immutable pin = the long commit SHA; `latest` tracks main; a Vx tag
          # publishes that release tag. Pin the 旧电脑 to a SHA/tag for repeatable deploys.
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=webdock
          cache-to: type=gha,mode=max,scope=webdock

      - name: Export queryable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/webdock:sha-${{ github.sha }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          syft-version: v1.50.0
          artifact-name: sbom-webdock-${{ github.sha }}.spdx.json
          output-file: sbom-webdock.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

  # TCR 是 WebDock 在中国大陆节点的可选镜像源。先用仓库变量显式开启，避免在
  # TCR 凭据尚未配置时把现有 GHCR 发布链路变成必失败；开启后只同步不可变 sha 标签，
  # 运行时按该标签部署，latest/tag 仍由 GHCR 保持人类可读别名。
  mirror-to-tcr:
    needs: build-push
    if: ${{ vars.WEBDOCK_TCR_MIRROR_ENABLED == 'true' && vars.TCR_BASE != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Mirror immutable image to TCR
        env:
          TCR_BASE: ${{ vars.TCR_BASE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${TCR_USERNAME:?missing TCR_USERNAME}"
          : "${TCR_PASSWORD:?missing TCR_PASSWORD}"
          auth_dir="$(mktemp -d)"
          auth_file="$auth_dir/auth.json"
          trap 'rm -rf "$auth_dir"' EXIT
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$auth_file" \
            -u "${{ github.actor }}" --password-stdin ghcr.io
          printf '%s' "$TCR_PASSWORD" | skopeo login --authfile "$auth_file" \
            -u "$TCR_USERNAME" --password-stdin "${TCR_BASE%%/*}"
          source="docker://ghcr.io/${{ github.repository_owner }}/webdock:sha-${GITHUB_SHA}"
          target="docker://${TCR_BASE}/webdock:sha-${GITHUB_SHA}"
          timeout 25m skopeo copy --all --preserve-digests --retry-times 3 \
            --authfile "$auth_file" "$source" "$target"
