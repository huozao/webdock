name: webdock

services:
  webdock:
    # The image is built and pushed to GHCR by webdock's release workflow, so the
    # 旧电脑 just pulls it (`docker compose pull && up -d`) instead of building.
    # Pin WEBDOCK_IMAGE to a SHA/Vx tag for a repeatable deploy. `build:` stays as
    # a local-dev fallback (`docker compose build`); it is not used on the laptop.
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${WEBDOCK_IMAGE:-ghcr.io/huozao/webdock:latest}
    container_name: webdock
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-laptop}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_TOKEN: ${API_TOKEN}
      VNC_PASSWORD: ${VNC_PASSWORD}
      NOVNC_PORT: "6080"
      FEISHU_NOVNC_PORT: "6081"
      DISPLAY: ":99"
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1366}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-768}
      DISPLAY_DEPTH: "24"
      BROWSER_PROFILE_DIR: /app/browser_data
      DEBUG_DIR: /app/logs/debug
      PHOTO_STORAGE_DIR: /app/photo_storage
      BROWSER_MODE: ${BROWSER_MODE:-ecs_cdp}
      CDP_URL: ${CDP_URL:-http://127.0.0.1:9222}
      CDP_CONNECT_TIMEOUT_SECONDS: ${CDP_CONNECT_TIMEOUT_SECONDS:-60}
      ATTACH_ON_START: ${ATTACH_ON_START:-false}
      CHATGPT_URL: ${CHATGPT_URL:-https://chatgpt.com/}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-120}
      RESPONSE_STABLE_SECONDS: ${RESPONSE_STABLE_SECONDS:-5}
      ENABLE_STEALTH: ${ENABLE_STEALTH:-true}
      SLOW_MO_MS: ${SLOW_MO_MS:-50}
      VIEWPORT_WIDTH: ${VIEWPORT_WIDTH:-1366}
      VIEWPORT_HEIGHT: ${VIEWPORT_HEIGHT:-768}
      VIEWPORT_JITTER_PX: ${VIEWPORT_JITTER_PX:-20}
      BROWSER_CHANNEL: ${BROWSER_CHANNEL:-chrome}
      CHROME_PROXY_SERVER: ${CHROME_PROXY_SERVER:-}
      # Feishu 同步浏览器（:100 / 9223 / browser_data/feishu-sync）。默认关闭：
      # 只有 webdock2 跑飞书同步，webdock1 拿到 false 就只定义不启动。
      # ⚠️ 代理与 ChatGPT 的 CHROME_PROXY_SERVER 是两个值，不要合并成一个键。
      FEISHU_CHROME_AUTOSTART: ${FEISHU_CHROME_AUTOSTART:-false}
      FEISHU_CHROME_URL: ${FEISHU_CHROME_URL:-https://www.feishu.cn/}
      FEISHU_CHROME_PROXY_SERVER: ${FEISHU_CHROME_PROXY_SERVER:-}
      BEFORE_TYPE_DELAY_MIN_MS: ${BEFORE_TYPE_DELAY_MIN_MS:-500}
      BEFORE_TYPE_DELAY_MAX_MS: ${BEFORE_TYPE_DELAY_MAX_MS:-1200}
      BEFORE_SEND_DELAY_MIN_MS: ${BEFORE_SEND_DELAY_MIN_MS:-300}
      BEFORE_SEND_DELAY_MAX_MS: ${BEFORE_SEND_DELAY_MAX_MS:-600}
      TYPING_DELAY_MIN_MS: ${TYPING_DELAY_MIN_MS:-0}
      TYPING_DELAY_MAX_MS: ${TYPING_DELAY_MAX_MS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${HOST_API_BIND:-127.0.0.1}:${HOST_API_PORT:-18000}:8000"
      - "${HOST_NOVNC_BIND:-127.0.0.1}:${HOST_NOVNC_PORT:-6080}:6080"
      - "${HOST_FEISHU_NOVNC_BIND:-127.0.0.1}:${HOST_FEISHU_NOVNC_PORT:-6081}:6081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOST_BROWSER_DATA_DIR:-/var/lib/webdock/browser_data}:/app/browser_data
      - ${HOST_LOGS_DIR:-/var/log/webdock}:/app/logs
      - ${HOST_PHOTO_STORAGE_DIR:-/var/lib/webdock/photo_storage}:/app/photo_storage
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # 独立 AI 额度浏览器。与生产 webdock 使用不同 profile/display/CDP，
  # 登录阶段 quota-entrypoint 不启动 Playwright attach；手工登录后再创建 ATTACH_ENABLED。
  quota-monitor:
    # Compatibility manifest: quota-monitor is maintained in the standalone
    # ai-quota-monitor repository and is no longer built from this Dockerfile.
    image: ${QUOTA_IMAGE:-ghcr.io/huozao/ai-quota-monitor:latest}
    container_name: quota-monitor
    restart: unless-stopped
    # 额度采集只在 webdock2 跑。门控放在 profile 而不是 webdock.service 的服务名列表里：
    # 服务名列表会在下一个新服务加进来时重演 2026-09-09 那次事故——ExecStop 是不带服务名的
    # `down`（停整个 project），ExecStart 却只点名 webdock，重启一次就把 quota-monitor
    # 永久删掉且没有任何告警。现在两端都不带服务名，靠 COMPOSE_PROFILES 决定跑哪些。
    profiles: ["quota"]
    environment:
      DISPLAY: ":101"
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1366}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-768}
      DISPLAY_DEPTH: "24"
      VNC_PASSWORD: ${VNC_PASSWORD}
      CHROME_PROXY_SERVER: ${CHROME_PROXY_SERVER:-}
      QUOTA_NOVNC_PORT: "6082"
      QUOTA_DATA_DIR: /app/quota_data
      QUOTA_PROFILE_DIR: /app/quota_browser_data
      QUOTA_POLL_MINUTES_MIN: ${QUOTA_POLL_MINUTES_MIN:-20}
      QUOTA_POLL_MINUTES_MAX: ${QUOTA_POLL_MINUTES_MAX:-30}
      QUOTA_PAGE_SETTLE_SECONDS: ${QUOTA_PAGE_SETTLE_SECONDS:-5}
      QUOTA_RETENTION_DAYS: ${QUOTA_RETENTION_DAYS:-7}
      QUOTA_REPORT_TIMES: ${QUOTA_REPORT_TIMES:-08:00,13:00,20:00}
      # 看板与飞书卡片的对外地址。⚠️ 缺这两个的后果不是样式问题：PUBLIC_LINK 为空时
      # 卡片「查看额度历史」指向空 URL，API_PREFIX 决定 latest/history 里下发的
      # screenshot_url 前缀，写错了看板的截图全是 404。
      QUOTA_PUBLIC_API_PREFIX: ${QUOTA_PUBLIC_API_PREFIX:-/console/quota/api}
      QUOTA_PUBLIC_LINK: ${QUOTA_PUBLIC_LINK:-https://hydwang.xyz/console/quota/}
      NOTIFY_ENDPOINT: ${NOTIFY_ENDPOINT:-http://host.docker.internal:18020/v1/internal/notify/send}
      NOTIFY_SOURCE_TOKEN: ${NOTIFY_SOURCE_TOKEN:-}
    entrypoint: ["/app/docker/quota-entrypoint.sh"]
    ports:
      - "${HOST_QUOTA_API_BIND:-127.0.0.1}:${HOST_QUOTA_API_PORT:-18002}:8001"
      - "${HOST_QUOTA_NOVNC_BIND:-127.0.0.1}:${HOST_QUOTA_NOVNC_PORT:-6082}:6082"
    volumes:
      - ${HOST_QUOTA_BROWSER_DATA_DIR:-/var/lib/webdock/quota_browser_data}:/app/quota_browser_data
      - ${HOST_QUOTA_DATA_DIR:-/var/lib/webdock/quota_data}:/app/quota_data
      - ${HOST_QUOTA_LOGS_DIR:-/var/log/webdock/quota-monitor}:/app/quota_logs
    shm_size: "2gb"
    security_opt:
      - seccomp=unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
