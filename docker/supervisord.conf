[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

# supervisorctl 的通道。⚠️ 原先没有这三段，于是**没有任何办法从外部单独重启一个 program**——
# 想让 Feishu Chrome 重来一次只能重建整个容器，连带把 ChatGPT 的登录会话一起打断。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx%(ENV_DISPLAY_DEPTH)s -ac -nolisten tcp +extension GLX
autorestart=true
priority=10
stdout_logfile=/app/logs/xvfb.log
stderr_logfile=/app/logs/xvfb.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -xkb -rfbauth /app/.vnc/passwd
autorestart=true
priority=20
startsecs=2
stdout_logfile=/app/logs/x11vnc.log
stderr_logfile=/app/logs/x11vnc.log

[program:feishu-xvfb]
command=/usr/bin/Xvfb :100 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx%(ENV_DISPLAY_DEPTH)s -ac -nolisten tcp +extension GLX
autorestart=true
priority=10
stdout_logfile=/app/logs/feishu-xvfb.log
stderr_logfile=/app/logs/feishu-xvfb.log

[program:feishu-x11vnc]
command=/usr/bin/x11vnc -display :100 -forever -shared -rfbport 5901 -xkb -rfbauth /app/.vnc/passwd
autorestart=true
priority=20
startsecs=2
stdout_logfile=/app/logs/feishu-x11vnc.log
stderr_logfile=/app/logs/feishu-x11vnc.log

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=30
startsecs=2
stdout_logfile=/app/logs/novnc.log
stderr_logfile=/app/logs/novnc.log

[program:feishu-novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6081 localhost:5901
autorestart=true
priority=30
startsecs=2
stdout_logfile=/app/logs/feishu-novnc.log
stderr_logfile=/app/logs/feishu-novnc.log

[program:chrome]
command=/bin/bash -lc 'exec /usr/bin/webdock-chrome --user-data-dir=/app/browser_data --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --no-first-run --no-default-browser-check --disable-session-crashed-bubble --hide-crash-restore-bubble --disable-breakpad --disable-crash-reporter --disable-dev-shm-usage --no-sandbox --disable-blink-features=AutomationControlled --window-size=1366,768 ${CHROME_PROXY_SERVER:+--proxy-server=$CHROME_PROXY_SERVER} https://chatgpt.com/'
directory=/app
autorestart=true
priority=40
startsecs=5
stdout_logfile=/app/logs/chrome.log
stderr_logfile=/app/logs/chrome.log
environment=DISPLAY=":99",HOME="/app"

# Feishu 同步浏览器。⚠️ 它以前由宿主机 systemd 的 oneshot unit 用 `docker exec -d` 起，
# 而 :100 / 5901 / 6081 三个伙伴进程一直在这个文件里——容器一重建，显示器和 noVNC 自动回来、
# 浏览器不回来，画面是空的，2026-09-09 因此静默停摆一天。放回 supervisord 与 ChatGPT 对称。
# autostart 由环境变量门控：只有 webdock2 打开，webdock1 拿到 false（program 定义在但不启动，
# autorestart 也就无从生效）。默认值写在 Dockerfile，展开不到会让 supervisord 整个起不来。
[program:feishu-chrome]
command=/bin/bash -lc 'exec /usr/bin/webdock-chrome --user-data-dir=/app/browser_data/feishu-sync --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --no-first-run --no-default-browser-check --disable-session-crashed-bubble --hide-crash-restore-bubble --disable-breakpad --disable-crash-reporter --disable-dev-shm-usage --no-sandbox --disable-blink-features=AutomationControlled --window-size=1366,768 ${FEISHU_CHROME_PROXY_SERVER:+--proxy-server=$FEISHU_CHROME_PROXY_SERVER} "$FEISHU_CHROME_URL"'
directory=/app
autostart=%(ENV_FEISHU_CHROME_AUTOSTART)s
autorestart=true
priority=40
startsecs=5
stdout_logfile=/app/logs/feishu-sync-chrome.log
stderr_logfile=/app/logs/feishu-sync-chrome.log
environment=DISPLAY=":100",HOME="/app"

[program:api]
command=python -m src
directory=/app
autorestart=true
priority=50
startsecs=5
stdout_logfile=/app/logs/api.log
stderr_logfile=/app/logs/api.log
environment=DISPLAY=":99",PYTHONPATH="/app"
